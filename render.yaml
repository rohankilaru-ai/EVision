services:
  # PostgreSQL Database
  - type: pserv
    name: evision-db
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.postgres
    envVars:
      - key: POSTGRES_USER
        value: evision
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: evision

  # Backend API
  - type: web
    name: evision-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evision-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: '["https://evision.vercel.app", "http://localhost:3000"]'
      - key: DEBUG
        value: "False"
    healthCheckPath: /health
